<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="fav-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <linearGradient id="fav-brand" x1="8" y1="6" x2="40" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="50%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>
    <linearGradient id="fav-spark" x1="22" y1="2" x2="26" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FDA4AF" />
    </linearGradient>
  </defs>

  <!-- Dark Rounded Square Container -->
  <rect width="48" height="48" rx="14" fill="url(#fav-bg)" stroke="#27272A" stroke-width="1.5" />

  <!-- Ambient Under-Glow -->
  <circle cx="24" cy="24" r="14" fill="#E11D48" opacity="0.2" filter="blur(5px)" />

  <!-- AIL Monogram Heart Silhouette -->
  <path
    d="M24 40.5C23.3 40.5 8.5 30 6 21C3.8 13 8.2 6.5 16.2 6.5C20.3 6.5 22.8 8.8 24 10.1C25.2 8.8 27.7 6.5 31.8 6.5C39.8 6.5 44.2 13 42 21C39.5 30 24.7 40.5 24 40.5Z"
    stroke="url(#fav-brand)"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- 'I' Column -->
  <path
    d="M24 14V27"
    stroke="url(#fav-brand)"
    stroke-width="3.2"
    stroke-linecap="round"
  />

  <!-- 'A' Bar & 'L' Base Sweep -->
  <path
    d="M14 25H30C32.5 25 33.8 27 32.8 29.5L31.2 32.5C29.8 35 27 37 24 37"
    stroke="url(#fav-brand)"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-opacity="0.9"
  />

  <!-- Apex Spark -->
  <path
    d="M24 2C24 5 26 6.5 28.5 6.5C26 6.5 24 8 24 11C24 8 22 6.5 19.5 6.5C22 6.5 24 5 24 2Z"
    fill="url(#fav-spark)"
  />
</svg>
