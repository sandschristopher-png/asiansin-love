  <path
    d="M24 38.5C23.2 38.5 11 30.2 8.6 22.8C6.5 16.3 10.2 9.5 17.2 9.5C20.8 9.5 23.1 11.4 24 12.5C24.9 11.4 27.2 9.5 30.8 9.5C37.8 9.5 41.5 16.3 39.4 22.8C37 30.2 24.8 38.5 24 38.5Z"
    fill="url(#fav-heart)"
  />

  <!-- Heart Inner Depth Cutout -->
  <path
    d="M24 34C23.5 34 14.5 27.5 12.6 21.5C11 16.5 13.8 12.8 18 12.8C21 12.8 23 14.5 24 15.5C25 14.5 27 12.8 30 12.8C34.2 12.8 37 16.5 35.4 21.5C33.5 27.5 24.5 34 24 34Z"
    fill="#09090B"
    fill-opacity="0.45"
  />

  <!-- Radiant Spark Star -->
  <path
    d="M34 5C34 8.5 36.5 11 40 11C36.5 11 34 13.5 34 17C34 13.5 31.5 11 28 11C31.5 11 34 8.5 34 5Z"
    fill="url(#fav-spark)"
  />
