<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#FFFFFF" />
  <title>Offline | Meet in Asia</title>
  <!--
    Static fallback precached by public/sw.js and served when a page cannot load with no
    network, so it is plain HTML/CSS with no app JavaScript. Mirrors the app's tokens: max-w-md
    column, two-tone wordmark (ink #413B5E + brand #8574B7), slate-50 page, white card.
  -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      background-color: #F8FAFC;
      color: #413B5E;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .shell { width: 100%; max-width: 448px; display: flex; flex-direction: column; align-items: center; }
    .wordmark {
      display: inline-flex; align-items: baseline; margin-bottom: 24px;
      font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 18px; font-weight: 600; letter-spacing: -0.025em; line-height: 1;
      text-decoration: none; user-select: none;
    }
    .wordmark .lead { color: #413B5E; }
    .wordmark .accent { color: #8574B7; }
    .card {
      width: 100%; display: flex; flex-direction: column; align-items: center; text-align: center;
      padding: 32px; background: #FFFFFF; border: 1px solid rgba(226, 232, 240, 0.8); border-radius: 16px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
    }
    .icon {
      width: 64px; height: 64px; margin-bottom: 20px; border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(133, 116, 183, 0.1); color: #8574B7;
    }
    h1 {
      margin-bottom: 8px; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; color: #413B5E;
      font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    p.body { max-width: 320px; margin-bottom: 24px; font-size: 14px; line-height: 1.625; color: #475569; }
    .retry {
      width: 100%; padding: 12px 16px; border: none; border-radius: 9999px; cursor: pointer;
      background-color: #8574B7; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 500;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
      transition: background-color 0.15s ease, transform 0.1s ease;
    }
    .retry:hover { background-color: #534377; }
    .retry:active { transform: scale(0.98); }
    .retry:focus-visible { outline: 2px solid #8574B7; outline-offset: 2px; }
    .foot { margin-top: 24px; font-size: 12px; color: #64748B; }
  </style>
</head>
<body>
  <main class="shell">
    <a href="/" class="wordmark" aria-label="Meet in Asia home">
      <span class="lead">Meet in&nbsp;</span><span class="accent">Asia</span>
    </a>

    <div class="card">
      <div class="icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h.01" />
          <path d="M8.5 16.429a5 5 0 0 1 7 0" />
          <path d="M5 12.859a10 10 0 0 1 5.17-2.69" />
          <path d="M19 12.859a10 10 0 0 0-2.007-1.523" />
          <path d="M2 8.82a15 15 0 0 1 4.177-2.643" />
          <path d="M22 8.82a15 15 0 0 0-11.288-3.764" />
          <path d="m2 2 20 20" />
        </svg>
      </div>

      <h1>You are offline</h1>
      <p class="body">Check your internet connection. Your messages and matches will load again automatically once you reconnect.</p>

      <button type="button" class="retry" onclick="window.location.reload()">Try Again</button>
    </div>

    <p class="foot">Meet in Asia &middot; Selfie-verified dating</p>
  </main>

  <script>
    // Reload as soon as the connection comes back, so the copy above holds.
    window.addEventListener('online', function () { window.location.reload(); });
  </script>
</body>
</html>
